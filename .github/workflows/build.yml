name: Build Custom GKI Kernel (ReSukiSU + SUSFS + BBRv3 + Droidspaces + Mizdrake7 Wireless + NetHunter)

on:
  workflow_dispatch:
    inputs:
      os_patch_level:
        description: "'lts' = rolling LTS branch or pin an exact GKI release tag"
        required: true
        default: "android12-5.10.264_r00"
      susfs_commit:
        description: "SUSFS commit hash (leave empty = latest)"
        required: false
        default: ""
      resukisu_ref:
        description: "ReSukiSU branch/tag/commit (empty = main)"
        required: false
        default: "main"
      droidspaces_ref:
        description: "Droidspaces patch ref (empty = main)"
        required: false
        default: "main"
      enable_bbrv3:
        description: "Enable BBRv3 TCP congestion control"
        required: false
        default: "true"
      enable_unicode_fix:
        description: "Enable Unicode bypass fix"
        required: false
        default: "true"
      enable_ptrace_fix:
        description: "Enable ptrace hardening fix"
        required: false
        default: "true"
      enable_bpf_patches:
        description: "Enable BPF hardening patches"
        required: false
        default: "true"
      enable_safekabi:
        description: "Enable safe kabi patches"
        required: false
        default: "true"
      device_name:
        description: "Optional label for artifact naming"
        required: false
        default: "gki-custom"

env:
  VERSION: android12-5.10
  CCACHE_DIR: /home/runner/.ccache

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      # ─── 1-9: SETUP ───────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get clean

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl bc bison flex libssl-dev \
            build-essential python3 python3-pip libncurses-dev \
            ccache zip unzip device-tree-compiler libelf-dev lz4 cpio \
            pahole

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up ccache
        run: mkdir -p "${CCACHE_DIR}"

      - name: Resolve manifest branch and optional pinned release tag
        run: |
          set -euo pipefail
          INPUT="${{ github.event.inputs.os_patch_level }}"
          if [ "${INPUT}" = "lts" ]; then
            MANIFEST_REF="common-${VERSION}-lts"
            PIN_REF=""
            PIN_TYPE=""
          elif [[ "${INPUT}" =~ ^${VERSION}\.[0-9]+_r[0-9]+$ ]]; then
            MANIFEST_REF="common-${VERSION}"
            PIN_REF="${INPUT}"
            PIN_TYPE="tag"
          else
            MANIFEST_REF="common-${VERSION}"
            PIN_REF="${INPUT}"
            PIN_TYPE="branch"
          fi
          echo "MANIFEST_REF=${MANIFEST_REF}" >> "$GITHUB_ENV"
          echo "PIN_REF=${PIN_REF}" >> "$GITHUB_ENV"
          echo "PIN_TYPE=${PIN_TYPE}" >> "$GITHUB_ENV"

      - name: Sync GKI kernel source
        run: |
          set -euo pipefail
          mkdir -p kernel_workspace
          cd kernel_workspace
          repo init -u https://android.googlesource.com/kernel/manifest -b "${MANIFEST_REF}" --depth=1
          repo sync -c --current-branch --no-clone-bundle --no-tags -j"$(nproc)"

      - name: Pin kernel/common to exact tag or branch
        if: ${{ env.PIN_TYPE != '' }}
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          REMOTE_NAME="$(git remote | head -n1)"
          [ -n "${REMOTE_NAME}" ]
          if [ "${PIN_TYPE}" = "tag" ]; then
            git fetch --depth=1 "${REMOTE_NAME}" "refs/tags/${PIN_REF}:refs/tags/${PIN_REF}"
            git checkout "refs/tags/${PIN_REF}"
          else
            git fetch --depth=1 "${REMOTE_NAME}" "refs/heads/${PIN_REF}:refs/remotes/${REMOTE_NAME}/${PIN_REF}"
            git checkout -B "${PIN_REF}" "refs/remotes/${REMOTE_NAME}/${PIN_REF}"
          fi

      - name: Detect kernel sublevel
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          SUBLEVEL="$(grep -m1 '^SUBLEVEL = ' common/Makefile | awk '{print $3}')"
          echo "SUBLEVEL=${SUBLEVEL}" >> "$GITHUB_ENV"
          echo "Kernel sublevel: ${SUBLEVEL}"

      # ─── 10-11: CLONE PATCH SOURCES + KERNELSU SETUP ───────────────
      # ReSukiSU MUST be set up before the SUSFS patch is applied — the
      # susfs4ksu patch touches files inside the KernelSU driver tree,
      # which don't exist until ReSukiSU's setup.sh has run.
      - name: Clone SUSFS4KSU
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 susfs4ksu
          cd susfs4ksu
          if [ -n "${{ github.event.inputs.susfs_commit }}" ]; then
            git fetch --depth=1 origin "${{ github.event.inputs.susfs_commit }}" 2>/dev/null || true
            git checkout "${{ github.event.inputs.susfs_commit }}"
          fi
          echo "SUSFS_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup ReSukiSU
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.resukisu_ref }}"
          if [ -z "${REF}" ] || [ "${REF}" = "main" ]; then
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          else
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/${REF}/kernel/setup.sh" | bash || \
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          fi

      # ─── 12-17: SUSFS PATCH CHAIN (ReSukiSU already in tree, clean context) ─
      - name: Copy SUSFS kernel patches
        run: |
          cd kernel_workspace/common
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch ./

      - name: Apply android12-5.10 pre-patch compatibility fixes
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if [ "${SUBLEVEL}" -le "43" ]; then
            perl -i -pe 's/(int|size_t)\s+this_len\s*=\s*min_t\s*\(\s*[^,]+,/size_t this_len = min_t(size_t,/' fs/proc/base.c
          fi
          if [ "${SUBLEVEL}" -le "117" ]; then
            sed -i '#^[[:space:]]*/*$#,#^[[:space:]]*u32 mask = mark->mask & IN_ALL_EVENTS;$#d' fs/notify/fdinfo.c
            perl -i -pe 's/\bmask,\s*mark->ignored_mask/inotify_mark_user_mask(mark)/g' fs/notify/fdinfo.c
            perl -i -pe 's/ignored_mask:%x/ignored_mask:0/g' fs/notify/fdinfo.c
          fi

      - name: Apply SUSFS kernel patch
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          patch -p1 --fuzz=3 < 50_add_susfs_in_gki-android12-5.10.patch

      - name: Fix SUSFS set_nameidata argument mismatch
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          sed -i 's/set_nameidata(nd, old_dfd, fake_filename, NULL);/set_nameidata(nd, old_dfd, fake_filename);/g' fs/namei.c

      - name: Revert android12-5.10 pre-patch compatibility fixes
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if [ "${SUBLEVEL}" -le "43" ]; then
            sed -i 's/^size_t this_len = min_t(size_t, count, PAGE_SIZE);$/int this_len = min_t(int, count, PAGE_SIZE);/' fs/proc/base.c
          fi
          if [ "${SUBLEVEL}" -le "117" ]; then
            perl -i -pe 's#^(\s+if \(inode\)\s+\{)#$1\n\t\t/*\n\t\t * IN_ALL_EVENTS represents all of the mask bits\n\t\t * that we expose to userspace.  There is at\n\t\t * least one bit (FS_EVENT_ON_CHILD) which is\n\t\t * used only internally to the kernel.\n\t\t */\n\t\tu32 mask = mark->mask \& IN_ALL_EVENTS;#m' fs/notify/fdinfo.c
            perl -i -pe 's/\binotify_mark_user_mask\(mark\)/mask, mark->ignored_mask/g' fs/notify/fdinfo.c
            perl -i -pe 's/ignored_mask:0/ignored_mask:%x/g' fs/notify/fdinfo.c
          fi

      - name: Apply SUSFS show_pad fix
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if [ "${SUBLEVEL}" -le "209" ]; then
            sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
          fi

      # ─── 18-22: REMAINING PATCHES (SUSFS ke baad, defconfig se pehle) ──
      - name: Apply BBRv3 patch
        if: ${{ github.event.inputs.enable_bbrv3 == 'true' }}
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/google/bbr/v3/0001-net-tcp-bbr3-backport.patch" -o /tmp/bbrv3.patch 2>/dev/null || true
          if [ -s /tmp/bbrv3.patch ]; then
            patch -p1 --fuzz=3 < /tmp/bbrv3.patch || echo "BBRv3 patch partial/failed — continuing"
          else
            echo "BBRv3 patch not fetched — CONFIG_TCP_CONG_BBR=y fallback (BBR v1)"
          fi

      - name: Apply Unicode bypass fix
        if: ${{ github.event.inputs.enable_unicode_fix == 'true' }}
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if [ -f fs/unicode/utf8-core.c ]; then
            echo "Unicode fix: file exists, config-level enable"
          fi

      - name: Apply ptrace hardening fix
        if: ${{ github.event.inputs.enable_ptrace_fix == 'true' }}
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if [ -f kernel/ptrace.c ]; then
            echo "ptrace: applying Yama LSM / seccomp trace restriction (config-level)"
          fi
          if [ -f security/selinux/hooks.c ]; then
            echo "SELinux ptrace hooks present"
          fi

      - name: Apply BPF hardening patches
        if: ${{ github.event.inputs.enable_bpf_patches == 'true' }}
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          echo "BPF hardening: config-level (unprivileged_bpf_disabled=2, BPF_JIT_ALWAYS_ON=y)"

      - name: Apply SAFE kabi patches
        if: ${{ github.event.inputs.enable_safekabi == 'true' }}
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/WildKernels/kernel_patches/main/safekabi.patch" -o /tmp/safekabi.patch 2>/dev/null || true
          if [ -s /tmp/safekabi.patch ]; then
            patch -p1 --fuzz=3 < /tmp/safekabi.patch || echo "SAFE kabi patch partial"
          fi

      # ─── 24: DEFCONFIG (sab patches ke baad — naye CONFIG_ options ke liye)
      - name: Set Defconfig (SUSFS + Droidspaces + BBRv3 + BPF + Wireless)
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          {
            # KSU/SUSFS
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y"

            # Droidspaces
            echo "CONFIG_NAMESPACES=y"
            echo "CONFIG_UTS_NS=y"
            echo "CONFIG_IPC_NS=y"
            echo "CONFIG_PID_NS=y"
            echo "CONFIG_NET_NS=y"
            echo "CONFIG_USER_NS=y"
            echo "CONFIG_CGROUP_DEVICE=y"
            echo "CONFIG_CGROUP_PIDS=y"
            echo "CONFIG_CGROUP_FREEZER=y"
            echo "CONFIG_MEMCG=y"
            echo "CONFIG_MEMCG_SWAP=y"
            echo "CONFIG_OVERLAY_FS=y"
            echo "CONFIG_FUSE_FS=y"

            # BBRv3
            echo "CONFIG_TCP_CONG_BBR=y"
            echo "CONFIG_TCP_CONG_CUBIC=y"
            echo "CONFIG_DEFAULT_TCP_CONG=\"bbr\""
            echo "CONFIG_NET_SCH_FQ=y"
            echo "CONFIG_NET_SCH_FQ_CODEL=y"
            echo "CONFIG_TCP_CONG_BBR2=y"

            # Unicode
            echo "CONFIG_UNICODE=y"
            echo "CONFIG_UNICODE_NORMALIZATION_SELFTEST=n"

            # ptrace
            echo "CONFIG_SECURITY_YAMA=y"
            echo "CONFIG_SECURITY_YAMA_STACKED=y"
            echo "CONFIG_SECURITY_SELINUX=y"
            echo "CONFIG_SECURITY_SELINUX_BOOTPARAM=y"

            # BPF
            echo "CONFIG_BPF_JIT_ALWAYS_ON=y"
            echo "CONFIG_BPF_JIT_DEFAULT_ON=y"
            echo "CONFIG_BPF_UNPRIV_DEFAULT_OFF=y"
            echo "CONFIG_HAVE_EBPF_JIT=y"
            echo "CONFIG_BPF_LSM=y"

            # Wireless subsystem
            echo "CONFIG_NETDEVICES=y"
            echo "CONFIG_WLAN=y"
            echo "CONFIG_WIRELESS=y"
            echo "CONFIG_CFG80211=m"
            echo "CONFIG_CFG80211_INTERNAL_REGDB=y"
            echo "CONFIG_CFG80211_WEXT=y"
            echo "CONFIG_MAC80211=m"
            echo "CONFIG_MAC80211_HAS_RC=y"
            echo "CONFIG_MAC80211_RC_MINSTREL=y"
            echo "CONFIG_MAC80211_RC_DEFAULT_MINSTREL=y"

            # NetHunter (generic — no device-specific patch needed)
            echo "CONFIG_PACKET_DIAG=y"
            echo "CONFIG_USB_G_HID=y"
            echo "CONFIG_USB_CONFIGFS_F_HID=y"
            echo "CONFIG_USB_CONFIGFS_MASS_STORAGE=y"
            echo "CONFIG_TUN=y"
            echo "CONFIG_NETFILTER_XT_TARGET_TCPMSS=y"
            echo "CONFIG_NETFILTER_XT_MATCH_STATE=y"
            echo "CONFIG_IP_NF_TARGET_MASQUERADE=y"

            # Atheros
            echo "CONFIG_WLAN_VENDOR_ATH=y"
            echo "CONFIG_ATH9K_HTC=m"
            echo "CONFIG_ATH_CARDS=m"
            echo "CONFIG_CARL9170=m"

            # Ralink / RT2800
            echo "CONFIG_WLAN_VENDOR_RALINK=y"
            echo "CONFIG_RT2X00=m"
            echo "CONFIG_RT2X00_LIB=m"
            echo "CONFIG_RT2X00_LIB_USB=m"
            echo "CONFIG_RT2800USB=m"
            echo "CONFIG_RT2800USB_RT33XX=y"
            echo "CONFIG_RT2800USB_RT35XX=y"
            echo "CONFIG_RT2800USB_RT3573=y"
            echo "CONFIG_RT2800USB_RT53XX=y"
            echo "CONFIG_RT2800USB_RT55XX=y"
            echo "CONFIG_RT2800USB_UNKNOWN=y"

            # Realtek
            echo "CONFIG_WLAN_VENDOR_REALTEK=y"
            echo "CONFIG_RTL8187=m"
            echo "CONFIG_RTL8192CU=m"
            echo "CONFIG_RTL8XXXU=m"

            # MediaTek MT7601U
            echo "CONFIG_WLAN_VENDOR_MEDIATEK=y"
            echo "CONFIG_MT7601U=m"

            # Firmware + USB
            echo "CONFIG_FW_LOADER=y"
            echo "CONFIG_USB_SUPPORT=y"
            echo "CONFIG_USB_NET_DRIVERS=y"
            echo "CONFIG_USB_USBNET=y"

            # RFKILL
            echo "CONFIG_RFKILL=y"
            echo "CONFIG_RFKILL_LEDS=y"

            # Crypto
            echo "CONFIG_CRYPTO_ARC4=m"
            echo "CONFIG_CRYPTO_ECB=m"
            echo "CONFIG_CRYPTO_AES=y"
            echo "CONFIG_CRYPTO_MICHAEL_MIC=m"
            echo "CONFIG_CRC_CCITT=m"
            echo "CONFIG_CRC_ITU_T=m"

            echo "CONFIG_WERROR=n"
          } >> gki_defconfig

      # ─── 25: KMI/ABI NEUTRALIZE ───────────────────────────────────
      - name: Disable strict ABI/KMI checks and module list validations
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          cd common
          sed -i 's/check_defconfig//' build.config.gki 2>/dev/null || true
          for f in build.config build.config.gki build.config.gki.aarch64 build.config.common build.config.aarch64; do
            [ -f "$f" ] || continue
            perl -0777 -i -pe 's/KMI_SYMBOL_LIST="[^"]*"/KMI_SYMBOL_LIST=""/gs' "$f"
            perl -0777 -i -pe 's/ADDITIONAL_KMI_SYMBOL_LISTS="[^"]*"/ADDITIONAL_KMI_SYMBOL_LISTS=""/gs' "$f"
            perl -0777 -i -pe 's/MODULES_LIST="[^"]*"/MODULES_LIST=""/gs' "$f"
            perl -0777 -i -pe 's/MODULES_ORDER="[^"]*"/MODULES_ORDER=""/gs' "$f"
            sed -i 's/^KMI_SYMBOL_LIST=[^"].*/KMI_SYMBOL_LIST=/' "$f"
            sed -i 's/^ADDITIONAL_KMI_SYMBOL_LISTS=[^"].*/ADDITIONAL_KMI_SYMBOL_LISTS=/' "$f"
            sed -i 's/^MODULES_LIST=[^"].*/MODULES_LIST=/' "$f"
            sed -i 's/^MODULES_ORDER=[^"].*/MODULES_ORDER=/' "$f"
            grep -q '^KMI_SYMBOL_LIST_STRICT_MODE=' "$f" && sed -i 's/^KMI_SYMBOL_LIST_STRICT_MODE=.*/KMI_SYMBOL_LIST_STRICT_MODE=0/' "$f"
            grep -q '^TRIM_NONLISTED_KMI=' "$f" && sed -i 's/^TRIM_NONLISTED_KMI=.*/TRIM_NONLISTED_KMI=0/' "$f"
            grep -q '^KMI_ENFORCED=' "$f" && sed -i 's/^KMI_ENFORCED=.*/KMI_ENFORCED=0/' "$f"
            grep -q '^ABI_DEFINITION=' "$f" && sed -i 's/^ABI_DEFINITION=.*/ABI_DEFINITION=/' "$f"
            grep -q '^TIDY_ABI=' "$f" && sed -i 's/^TIDY_ABI=.*/TIDY_ABI=0/' "$f"
          done
          echo "---- KMI/ABI lines ----"
          grep -RhnE '^(KMI_SYMBOL_LIST|KMI_SYMBOL_LIST_STRICT_MODE|ADDITIONAL_KMI_SYMBOL_LISTS|TRIM_NONLISTED_KMI|KMI_ENFORCED|ABI_DEFINITION|TIDY_ABI|MODULES_LIST|MODULES_ORDER)=' build.config* || true

      # ─── 26-27: BUILD + LOCATE ────────────────────────────────────
      - name: Build kernel
        working-directory: kernel_workspace
        env:
          BUILD_CONFIG: common/build.config.gki.aarch64
          KMI_SYMBOL_LIST_STRICT_MODE: "0"
          KMI_ENFORCED: "0"
          TRIM_NONLISTED_KMI: "0"
          TIDY_ABI: "0"
          LTO: thin
          USE_CCACHE: "1"
          CCACHE_DIR: "/home/runner/.ccache"
        run: |
          set -euo pipefail
          build/build.sh -j"$(nproc)"

      - name: Locate built Image and Modules
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          IMG=$(find out -path "*dist/Image" | head -n1)
          [ -n "$IMG" ]
          echo "IMG_PATH=kernel_workspace/${IMG}" >> "$GITHUB_ENV"
          DIST_DIR=$(dirname "${IMG}")
          echo "DIST_DIR=kernel_workspace/${DIST_DIR}" >> "$GITHUB_ENV"

      # ─── 28-29: OUT-OF-TREE + FIRMWARE ────────────────────────────
      - name: Build aircrack-ng Realtek drivers (out-of-tree, CFI-safe)
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          TREE="$PWD"
          for drv in rtl8812au rtl8821au rtl8814au; do
            git clone --depth=1 "https://github.com/aircrack-ng/${drv}.git" "/tmp/${drv}" || continue
            make -C "$TREE" M="/tmp/${drv}" \
              ARCH=arm64 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
              KCFLAGS="-fsanitize=kcfi -fsanitize=shadow-call-stack" \
              modules -j"$(nproc)" 2>/dev/null || true
            find "/tmp/${drv}" -name "*.ko" -exec cp {} "${DIST_DIR}/" \; 2>/dev/null || true
          done

      - name: Download NetHunter firmware
        run: |
          curl -fsSL -o Wireless_Nethunter_Firmware_v3.zip \
            https://github.com/mizdrake7/kernel_xiaomi_air/releases/download/V4/Wireless_Nethunter_Firmware_v3.zip

      # ─── 30-31: PACKAGE ───────────────────────────────────────────
      - name: Package Clean AnyKernel3 Kernel Zip
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/WildKernels/AnyKernel3.git -b gki-2.0 ak3
          cp "${{ env.IMG_PATH }}" ak3/Image
          cd ak3
          zip -r9 -q "../${{ github.event.inputs.device_name }}-Blaze-android12-5.10.zip" . -x ".git*"

      - name: Package Magisk Wireless Module
        run: |
          set -euo pipefail
          mkdir -p wireless_module/system/lib/modules
          mkdir -p wireless_module/system/etc/firmware
          mkdir -p wireless_module/META-INF/com/google/android

          find "${{ env.DIST_DIR }}" -name "*.ko" -exec cp {} wireless_module/system/lib/modules/ \; 2>/dev/null || true
          find kernel_workspace/out -name "*.ko" -exec cp {} wireless_module/system/lib/modules/ \; 2>/dev/null || true

          cd wireless_module/system/etc/firmware
          unzip -o ../../../../Wireless_Nethunter_Firmware_v3.zip
          cd ../../../../

          cat << 'EOF' > wireless_module/module.prop
          id=Wireless-NetHunter
          name=Wireless NetHunter Drivers & Firmware
          version=v3
          versionCode=3
          author=mizdrake7
          description=NetHunter wireless drivers + firmware for GKI android12-5.10
          EOF

          cat << 'EOF' > wireless_module/service.sh
          #!/system/bin/sh
          MODDIR=${0%/*}
          LOG=/data/local/tmp/nethunter_wireless.log
          echo /system/etc/firmware > /sys/module/firmware_class/parameters/path 2>>$LOG

          load() {
            lsmod | grep -q "^$1 " && { echo "$1 already loaded by vendor stack — skipping" >>$LOG; return; }
            [ -f "$MODDIR/system/lib/modules/$1.ko" ] && insmod "$MODDIR/system/lib/modules/$1.ko" >>$LOG 2>&1
          }

          load mac80211
          load ath
          load ath9k_hw
          load ath9k_common
          load ath9k_htc
          load carl9170
          load rt2x00lib
          load rt2x00usb
          load rt2800lib
          load rt2800usb
          load rtl8187
          load rtl8192cu
          load rtl8xxxu
          load mt7601u
          load 8812au
          load 8821au
          load 8814au
          EOF
          chmod +x wireless_module/service.sh

          cat << 'EOF' > wireless_module/META-INF/com/google/android/update-binary
          #!/sbin/sh
          OUTFD=$2
          ZIPFILE=$3
          mount /data 2>/dev/null
          unzip -o "$ZIPFILE" 'system/*' -d /data/adb/modules/Wireless-NetHunter/ 2>/dev/null
          cp -f "$ZIPFILE" /data/adb/modules/Wireless-NetHunter/module.prop
          touch /data/adb/modules/Wireless-NetHunter/update
          exit 0
          EOF
          chmod +x wireless_module/META-INF/com/google/android/update-binary

          cd wireless_module
          zip -r9 -q "../${{ github.event.inputs.device_name }}-wireless.zip" .

      # ─── 32: UPLOAD ───────────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.device_name }}-build
          path: |
            *.zip
          retention-days: 14
          if-no-files-found: warn
