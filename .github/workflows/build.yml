name: Build GKI NetHunter Wireless (android12-5.10)

on:
  workflow_dispatch:
    inputs:
      ack_tag:
        description: "Exact ACK tag (e.g. android12-5.10.264_r00)"
        required: true
        default: "android12-5.10.264_r00"
      susfs_commit:
        description: "SUSFS commit hash (empty = latest gki-android12-5.10)"
        required: false
        default: ""
      resukisu_ref:
        description: "ReSukiSU branch/tag/commit (empty = main)"
        required: false
        default: "main"
      device_name:
        description: "Artifact label"
        required: false
        default: "gki-nethunter-wireless"

env:
  VERSION: android12-5.10
  CCACHE_DIR: /home/runner/.ccache

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get clean

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl bc bison flex libssl-dev \
            build-essential python3 python3-pip libncurses-dev \
            ccache zip unzip device-tree-compiler libelf-dev lz4 cpio

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup ccache
        run: mkdir -p "${CCACHE_DIR}"

      - name: Sync ACK source at exact tag
        run: |
          set -euo pipefail
          mkdir -p kernel_workspace
          cd kernel_workspace
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-${VERSION} --depth=1
          repo sync -c --current-branch --no-clone-bundle --no-tags -j"$(nproc)"

      - name: Pin kernel/common to exact tag
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.ack_tag }}"
          REMOTE="$(git remote | head -n1)"
          git fetch --depth=1 "$REMOTE" "refs/tags/${TAG}:refs/tags/${TAG}"
          git checkout "refs/tags/${TAG}"
          echo "Pinned to: ${TAG}"

      - name: Clone SUSFS4KSU
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 susfs4ksu
          cd susfs4ksu
          if [ -n "${{ github.event.inputs.susfs_commit }}" ]; then
            git fetch --depth=1 origin "${{ github.event.inputs.susfs_commit }}" 2>/dev/null || true
            git checkout "${{ github.event.inputs.susfs_commit }}"
          fi
          echo "SUSFS_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply NetHunter injection patches (mizdrake7 22cd3952)
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/mizdrake7/kernel_xiaomi_air/commit/22cd39520ec91fc9e8e622c5deae1994abbd0f55.patch" -o /tmp/nethunter.patch
          patch -p1 --fuzz=3 < /tmp/nethunter.patch

      - name: Copy SUSFS kernel patches
        run: |
          cd kernel_workspace/common
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch ./

      - name: Detect kernel sublevel
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          SUBLEVEL="$(grep -m1 '^SUBLEVEL = ' common/Makefile | awk '{print $3}')"
          echo "SUBLEVEL=${SUBLEVEL}" >> "$GITHUB_ENV"
          echo "Kernel sublevel: ${SUBLEVEL}"

      - name: Apply SUSFS kernel patch
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          patch -p1 --fuzz=3 < 50_add_susfs_in_gki-android12-5.10.patch
          sed -i 's/set_nameidata(nd, old_dfd, fake_filename, NULL);/set_nameidata(nd, old_dfd, fake_filename);/g' fs/namei.c

      - name: Setup ReSukiSU
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.resukisu_ref }}"
          if [ "${REF}" = "main" ] || [ -z "${REF}" ]; then
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          else
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/${REF}/kernel/setup.sh" | bash || \
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          fi

      - name: Configure defconfig (wireless drivers + NetHunter)
        working-directory: kernel_workspace/common/arch/arm64/configs
        run: |
          set -euo pipefail
          {
            echo "CONFIG_ATH9K_HTC=m"
            echo "CONFIG_CARL9170=m"
            echo "CONFIG_RT2X00=m"
            echo "CONFIG_RT2800USB=m"
            echo "CONFIG_RTL8187=m"
            echo "CONFIG_RTL8192CU=m"
            echo "CONFIG_RTL8XXXU=m"
            echo "CONFIG_MT7601U=m"
            echo "CONFIG_CFG80211_WEXT=y"
            echo "CONFIG_PACKET_DIAG=y"
            echo "CONFIG_USB_G_HID=y"
            echo "CONFIG_CRYPTO_ARC4=m"
            echo "CONFIG_CRYPTO_MICHAEL_MIC=m"
            echo "CONFIG_RFKILL=y"
            echo "CONFIG_RFKILL_LEDS=y"
          } >> gki_defconfig

      - name: Neutralize KMI/ABI enforcement
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          cd common
          sed -i 's/check_defconfig//' build.config.gki 2>/dev/null || true
          for f in build.config build.config.gki build.config.gki.aarch64 build.config.common build.config.aarch64; do
            [ -f "$f" ] || continue
            perl -0777 -i -pe 's/KMI_SYMBOL_LIST="[^"]*"/KMI_SYMBOL_LIST=""/gs' "$f"
            perl -0777 -i -pe 's/ADDITIONAL_KMI_SYMBOL_LISTS="[^"]*"/ADDITIONAL_KMI_SYMBOL_LISTS=""/gs' "$f"
            perl -0777 -i -pe 's/MODULES_LIST="[^"]*"/MODULES_LIST=""/gs' "$f"
            perl -0777 -i -pe 's/MODULES_ORDER="[^"]*"/MODULES_ORDER=""/gs' "$f"
            sed -i 's/^KMI_SYMBOL_LIST=[^"].*/KMI_SYMBOL_LIST=/' "$f"
            sed -i 's/^ADDITIONAL_KMI_SYMBOL_LISTS=[^"].*/ADDITIONAL_KMI_SYMBOL_LISTS=/' "$f"
            sed -i 's/^MODULES_LIST=[^"].*/MODULES_LIST=/' "$f"
            sed -i 's/^MODULES_ORDER=[^"].*/MODULES_ORDER=/' "$f"
            grep -q '^KMI_SYMBOL_LIST_STRICT_MODE=' "$f" && sed -i 's/^KMI_SYMBOL_LIST_STRICT_MODE=.*/KMI_SYMBOL_LIST_STRICT_MODE=0/' "$f"
            grep -q '^TRIM_NONLISTED_KMI=' "$f" && sed -i 's/^TRIM_NONLISTED_KMI=.*/TRIM_NONLISTED_KMI=0/' "$f"
            grep -q '^KMI_ENFORCED=' "$f" && sed -i 's/^KMI_ENFORCED=.*/KMI_ENFORCED=0/' "$f"
            grep -q '^ABI_DEFINITION=' "$f" && sed -i 's/^ABI_DEFINITION=.*/ABI_DEFINITION=/' "$f"
            grep -q '^TIDY_ABI=' "$f" && sed -i 's/^TIDY_ABI=.*/TIDY_ABI=0/' "$f"
          done

      - name: Build kernel
        working-directory: kernel_workspace
        env:
          BUILD_CONFIG: common/build.config.gki.aarch64
          KMI_SYMBOL_LIST_STRICT_MODE: "0"
          KMI_ENFORCED: "0"
          TRIM_NONLISTED_KMI: "0"
          TIDY_ABI: "0"
          LTO: thin
          USE_CCACHE: "1"
          CCACHE_DIR: "/home/runner/.ccache"
        run: |
          set -euo pipefail
          build/build.sh -j"$(nproc)"

      - name: Locate built modules
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          DIST=$(find out -path "*dist" -type d | head -n1)
          [ -n "${DIST}" ] || DIST="out"
          echo "DIST_DIR=kernel_workspace/${DIST}" >> "$GITHUB_ENV"

      - name: Build aircrack-ng Realtek drivers (out-of-tree, CFI-safe)
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          TREE="$PWD"
          for drv in rtl8812au rtl8821au rtl8814au; do
            git clone --depth=1 "https://github.com/aircrack-ng/${drv}.git" "/tmp/${drv}" || continue
            make -C "$TREE" M="/tmp/${drv}" \
              ARCH=arm64 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
              KCFLAGS="-fsanitize=kcfi -fsanitize=shadow-call-stack" \
              modules -j"$(nproc)" 2>/dev/null || true
            find "/tmp/${drv}" -name "*.ko" -exec cp {} "${DIST_DIR}/" \; 2>/dev/null || true
          done

      - name: Download NetHunter firmware
        run: |
          curl -fsSL -o Wireless_Nethunter_Firmware_v3.zip \
            https://github.com/mizdrake7/kernel_xiaomi_air/releases/download/V4/Wireless_Nethunter_Firmware_v3.zip

      - name: Package Magisk Wireless Module
        run: |
          set -euo pipefail
          mkdir -p wireless_module/system/lib/modules
          mkdir -p wireless_module/system/etc/firmware
          mkdir -p wireless_module/META-INF/com/google/android

          find "${{ env.DIST_DIR }}" -name "*.ko" -exec cp {} wireless_module/system/lib/modules/ \; 2>/dev/null || true
          find kernel_workspace/out -name "*.ko" -exec cp {} wireless_module/system/lib/modules/ \; 2>/dev/null || true

          cd wireless_module/system/etc/firmware
          unzip -o ../../../../Wireless_Nethunter_Firmware_v3.zip
          cd ../../../../

          cat << 'EOF' > wireless_module/module.prop
          id=Wireless-NetHunter
          name=GKI NetHunter Wireless Drivers
          version=v1
          versionCode=1
          author=build
          description=mac80211 + USB WiFi drivers + firmware for GKI android12-5.10
          EOF

          cat << 'EOF' > wireless_module/service.sh
          #!/system/bin/sh
          MODDIR=${0%/*}
          LOG=/data/local/tmp/nethunter_wireless.log
          echo /system/etc/firmware > /sys/module/firmware_class/parameters/path 2>>$LOG

          load() {
            [ -f "$MODDIR/system/lib/modules/$1.ko" ] && insmod "$MODDIR/system/lib/modules/$1.ko" >>$LOG 2>&1
          }

          load mac80211
          load ath9k_hw
          load ath9k_common
          load ath9k_htc
          load carl9170
          load rt2x00lib
          load rt2x00usb
          load rt2800lib
          load rt2800usb
          load rtl8187
          load rtl8192cu
          load rtl8xxxu
          load mt7601u
          load 8812au
          load 8821au
          load 8814au
          EOF
          chmod +x wireless_module/service.sh

          cat << 'EOF' > wireless_module/META-INF/com/google/android/update-binary
          #!/sbin/sh
          OUTFD=$2
          ZIPFILE=$3
          mount /data 2>/dev/null
          unzip -o "$ZIPFILE" 'system/*' -d /data/adb/modules/Wireless-NetHunter/ 2>/dev/null
          cp -f "$ZIPFILE" /data/adb/modules/Wireless-NetHunter/module.prop
          touch /data/adb/modules/Wireless-NetHunter/update
          exit 0
          EOF
          chmod +x wireless_module/META-INF/com/google/android/update-binary

          cd wireless_module
          zip -r9 -q "../${{ github.event.inputs.device_name }}-wireless.zip" .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.device_name }}-build
          path: |
            *.zip
          retention-days: 14
