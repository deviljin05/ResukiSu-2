name: Build Custom GKI Kernel (ReSukiSU + SUSFS + BBRv3 + Mizdrake7 Wireless)

on:
  workflow_dispatch:
    inputs:
      os_patch_level:
        description: "'lts' = rolling LTS branch or pin an exact GKI release tag"
        required: true
        default: "android12-5.10.264_r00"
      susfs_commit:
        description: "SUSFS commit hash (leave empty = latest)"
        required: false
        default: ""
      device_name:
        description: "Optional label for artifact naming"
        required: false
        default: "gki-custom"

env:
  VERSION: android12-5.10
  CCACHE_DIR: /home/runner/.ccache

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get clean

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl bc bison flex libssl-dev \
            build-essential python3 python3-pip libncurses-dev \
            ccache zip unzip device-tree-compiler libelf-dev

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up ccache
        run: mkdir -p "${CCACHE_DIR}"

      - name: Resolve manifest branch and optional pinned release tag
        run: |
          set -euo pipefail
          INPUT="${{ github.event.inputs.os_patch_level }}"
          if [ "${INPUT}" = "lts" ]; then
            MANIFEST_REF="common-${VERSION}-lts"
            PIN_REF=""
            PIN_TYPE=""
          elif [[ "${INPUT}" =~ ^${VERSION}\.[0-9]+_r[0-9]+$ ]]; then
            MANIFEST_REF="common-${VERSION}"
            PIN_REF="${INPUT}"
            PIN_TYPE="tag"
          else
            MANIFEST_REF="common-${VERSION}"
            PIN_REF="${INPUT}"
            PIN_TYPE="branch"
          fi
          echo "MANIFEST_REF=${MANIFEST_REF}" >> "$GITHUB_ENV"
          echo "PIN_REF=${PIN_REF}" >> "$GITHUB_ENV"
          echo "PIN_TYPE=${PIN_TYPE}" >> "$GITHUB_ENV"

      - name: Sync GKI kernel source
        run: |
          set -euo pipefail
          mkdir -p kernel_workspace
          cd kernel_workspace
          repo init -u https://android.googlesource.com/kernel/manifest -b "${MANIFEST_REF}" --depth=1
          repo sync -c --current-branch --no-clone-bundle --no-tags -j"$(nproc)"

      - name: Pin kernel/common to exact tag or branch
        if: ${{ env.PIN_TYPE != '' }}
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          REMOTE_NAME="$(git remote | head -n1)"
          [ -n "${REMOTE_NAME}" ]
          if [ "${PIN_TYPE}" = "tag" ]; then
            git fetch --depth=1 "${REMOTE_NAME}" "refs/tags/${PIN_REF}:refs/tags/${PIN_REF}"
            git checkout "refs/tags/${PIN_REF}"
          else
            git fetch --depth=1 "${REMOTE_NAME}" "refs/heads/${PIN_REF}:refs/remotes/${REMOTE_NAME}/${PIN_REF}"
            git checkout -B "${PIN_REF}" "refs/remotes/${REMOTE_NAME}/${PIN_REF}"
          fi

      - name: Detect kernel sublevel
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          SUBLEVEL="$(grep -m1 '^SUBLEVEL = ' common/Makefile | awk '{print $3}')"
          echo "SUBLEVEL=${SUBLEVEL}" >> "$GITHUB_ENV"

      - name: Clone SUSFS4KSU
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 susfs4ksu
          cd susfs4ksu
          if [ -n "${{ github.event.inputs.susfs_commit }}" ]; then
            git checkout "${{ github.event.inputs.susfs_commit }}"
          fi
          echo "SUSFS_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set Mizdrake7 Style Defconfig (SUSFS + Modular Wireless)
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y"

            # --- MIZDRAKE7 NETHUNTER WIRELESS CONFIGS ---
            # This is the exact config set from mizdrake7/kernel_xiaomi_air
            # commit 3d298e7 ("defconfig: Enable Nethunter"), applied here
            # to arch/arm64/configs/gki_defconfig instead of his device's
            # mgk_64_k515_defconfig. Kept the base wireless subsystem lines
            # (NETDEVICES/WLAN/WIRELESS/_HAS_RC/_MINSTREL/etc.) since GKI's
            # own defconfig doesn't already select them the way his MTK
            # vendor base did — his commit only had to add the driver-level
            # symbols below because CFG80211/MAC80211/WLAN core was already
            # on in his tree.
            echo "CONFIG_NETDEVICES=y"
            echo "CONFIG_WLAN=y"
            echo "CONFIG_WIRELESS=y"
            echo "CONFIG_CFG80211=m"
            echo "CONFIG_CFG80211_INTERNAL_REGDB=y"
            echo "CONFIG_MAC80211=m"
            echo "CONFIG_MAC80211_HAS_RC=y"
            echo "CONFIG_MAC80211_RC_MINSTREL=y"
            echo "CONFIG_MAC80211_RC_DEFAULT_MINSTREL=y"

            # Nethunter (verbatim from mizdrake7's commit)
            echo "CONFIG_PACKET_DIAG=y"
            echo "CONFIG_USB_G_HID=y"

            # Atheros
            echo "CONFIG_WLAN_VENDOR_ATH=y"
            echo "CONFIG_ATH9K_HTC=m"

            # Ralink / RT2800
            echo "CONFIG_WLAN_VENDOR_RALINK=y"
            echo "CONFIG_RT2X00=m"
            echo "CONFIG_RT2X00_LIB=m"
            echo "CONFIG_RT2X00_LIB_USB=m"
            echo "CONFIG_RT2800USB=m"
            echo "CONFIG_RT2800USB_RT33XX=y"
            echo "CONFIG_RT2800USB_RT35XX=y"
            echo "CONFIG_RT2800USB_RT3573=y"
            echo "CONFIG_RT2800USB_RT53XX=y"
            echo "CONFIG_RT2800USB_RT55XX=y"
            echo "CONFIG_RT2800USB_UNKNOWN=y"

            # Realtek
            echo "CONFIG_WLAN_VENDOR_REALTEK=y"
            echo "CONFIG_RTL8187=m"

            # MediaTek MT7601U
            echo "CONFIG_WLAN_VENDOR_MEDIATEK=y"
            echo "CONFIG_MT7601U=m"

            # Firmware + USB
            echo "CONFIG_FW_LOADER=y"
            echo "CONFIG_USB_SUPPORT=y"
            echo "CONFIG_USB_NET_DRIVERS=y"
            echo "CONFIG_USB_USBNET=y"

            echo "CONFIG_WERROR=n"
          } >> gki_defconfig

      - name: Copy SUSFS kernel patches
        run: |
          cd kernel_workspace/common
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch ./

      - name: Apply android12-5.10 pre-patch compatibility fixes
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if [ "${SUBLEVEL}" -le "43" ]; then
            perl -i -pe 's/(int|size_t)\s+this_len\s*=\s*min_t\s*\(\s*[^,]+,/size_t this_len = min_t(size_t,/' fs/proc/base.c
          fi
          if [ "${SUBLEVEL}" -le "117" ]; then
            sed -i '#^[[:space:]]*/*$#,#^[[:space:]]*u32 mask = mark->mask & IN_ALL_EVENTS;$#d' fs/notify/fdinfo.c
            perl -i -pe 's/\bmask,\s*mark->ignored_mask/inotify_mark_user_mask(mark)/g' fs/notify/fdinfo.c
            perl -i -pe 's/ignored_mask:%x/ignored_mask:0/g' fs/notify/fdinfo.c
          fi

      - name: Apply SUSFS kernel patch
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          patch -p1 --fuzz=3 < 50_add_susfs_in_gki-android12-5.10.patch

      - name: Fix SUSFS set_nameidata argument mismatch
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          sed -i 's/set_nameidata(nd, old_dfd, fake_filename, NULL);/set_nameidata(nd, old_dfd, fake_filename);/g' fs/namei.c

      - name: Revert android12-5.10 pre-patch compatibility fixes
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if [ "${SUBLEVEL}" -le "43" ]; then
            sed -i 's/^size_t this_len = min_t(size_t, count, PAGE_SIZE);$/int this_len = min_t(int, count, PAGE_SIZE);/' fs/proc/base.c
          fi
          if [ "${SUBLEVEL}" -le "117" ]; then
            perl -i -pe 's#^(\s+if \(inode\)\s+\{)#$1\n\t\t/*\n\t\t * IN_ALL_EVENTS represents all of the mask bits\n\t\t * that we expose to userspace.  There is at\n\t\t * least one bit (FS_EVENT_ON_CHILD) which is\n\t\t * used only internally to the kernel.\n\t\t */\n\t\tu32 mask = mark->mask \& IN_ALL_EVENTS;#m' fs/notify/fdinfo.c
            perl -i -pe 's/\binotify_mark_user_mask\(mark\)/mask, mark->ignored_mask/g' fs/notify/fdinfo.c
            perl -i -pe 's/ignored_mask:0/ignored_mask:%x/g' fs/notify/fdinfo.c
          fi

      - name: Apply SUSFS show_pad fix
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if [ "${SUBLEVEL}" -le "209" ]; then
            sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
          fi

      - name: Setup ReSukiSU
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Disable strict ABI/KMI checks and module list validations
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          cd common

          # Neutralize check_defconfig call in build.config.gki (harmless if absent)
          sed -i 's/check_defconfig//' build.config.gki 2>/dev/null || true

          # Every one of these needs to be forced to "off"/empty, not just
          # MODULES_LIST/ORDER/KMI_SYMBOL_LIST — the previous run failed
          # because KMI_SYMBOL_LIST_STRICT_MODE was left enabled with no
          # KMI_SYMBOL_LIST to satisfy it. Also drop the ABI check and
          # KMI enforcement, or build.sh dies at olddefconfig/abi steps too.
          for f in build.config build.config.gki build.config.gki.aarch64 build.config.common build.config.aarch64; do
            [ -f "$f" ] || continue
            grep -q '^KMI_SYMBOL_LIST_STRICT_MODE=' "$f" && \
              sed -i 's/^KMI_SYMBOL_LIST_STRICT_MODE=.*/KMI_SYMBOL_LIST_STRICT_MODE=0/' "$f"
            grep -q '^KMI_SYMBOL_LIST=' "$f" && \
              sed -i 's/^KMI_SYMBOL_LIST=.*/KMI_SYMBOL_LIST=/' "$f"
            grep -q '^ADDITIONAL_KMI_SYMBOL_LISTS=' "$f" && \
              sed -i 's/^ADDITIONAL_KMI_SYMBOL_LISTS=.*/ADDITIONAL_KMI_SYMBOL_LISTS=/' "$f"
            grep -q '^TRIM_NONLISTED_KMI=' "$f" && \
              sed -i 's/^TRIM_NONLISTED_KMI=.*/TRIM_NONLISTED_KMI=0/' "$f"
            grep -q '^KMI_ENFORCED=' "$f" && \
              sed -i 's/^KMI_ENFORCED=.*/KMI_ENFORCED=0/' "$f"
            grep -q '^ABI_DEFINITION=' "$f" && \
              sed -i 's/^ABI_DEFINITION=.*/ABI_DEFINITION=/' "$f"
            grep -q '^TIDY_ABI=' "$f" && \
              sed -i 's/^TIDY_ABI=.*/TIDY_ABI=0/' "$f"
            grep -q '^MODULES_LIST=' "$f" && \
              sed -i 's/^MODULES_LIST=.*/MODULES_LIST=/' "$f"
            grep -q '^MODULES_ORDER=' "$f" && \
              sed -i 's/^MODULES_ORDER=.*/MODULES_ORDER=/' "$f"
          done

          echo "---- resulting KMI/ABI-related lines ----"
          grep -RhnE '^(KMI_SYMBOL_LIST|KMI_SYMBOL_LIST_STRICT_MODE|ADDITIONAL_KMI_SYMBOL_LISTS|TRIM_NONLISTED_KMI|KMI_ENFORCED|ABI_DEFINITION|TIDY_ABI|MODULES_LIST|MODULES_ORDER)=' build.config* || true

      - name: Build kernel
        working-directory: kernel_workspace
        env:
          # Belt-and-suspenders: build.config.gki does
          # KMI_SYMBOL_LIST_STRICT_MODE=${KMI_SYMBOL_LIST_STRICT_MODE:-1}
          # so even if a sed above missed a file, this env var wins because
          # the default only applies when the var is completely unset.
          KMI_SYMBOL_LIST_STRICT_MODE: "0"
          KMI_ENFORCED: "0"
          TRIM_NONLISTED_KMI: "0"
          TIDY_ABI: "0"
        run: |
          set -euo pipefail
          LTO=thin \
          BUILD_CONFIG=common/build.config.gki.aarch64 \
          USE_CCACHE=1 \
          CCACHE_DIR="${CCACHE_DIR}" \
          KMI_SYMBOL_LIST_STRICT_MODE=0 \
          KMI_ENFORCED=0 \
          TRIM_NONLISTED_KMI=0 \
          TIDY_ABI=0 \
          build/build.sh -j"$(nproc)"

      - name: Locate built Image and Modules
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          IMG=$(find out -path "*dist/Image" | head -n1)
          [ -n "$IMG" ]
          echo "IMG_PATH=kernel_workspace/${IMG}" >> "$GITHUB_ENV"
          DIST_DIR=$(dirname "${IMG}")
          echo "DIST_DIR=kernel_workspace/${DIST_DIR}" >> "$GITHUB_ENV"

      - name: Package Clean AnyKernel3 Kernel Zip
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/WildKernels/AnyKernel3.git -b gki-2.0 ak3
          cp "${{ env.IMG_PATH }}" ak3/Image
          cd ak3
          zip -r9 -q "../${{ github.event.inputs.device_name }}-Blaze-android12-5.10.zip" . -x ".git*"

      - name: Generate Mizdrake7 Style Wireless Magisk Module
        run: |
          set -euo pipefail
          mkdir -p wireless_module/system/lib/modules
          mkdir -p wireless_module/META-INF/com/google/android

          if [ -f "${{ env.DIST_DIR }}/kernel_modules.tar.gz" ]; then
            tar -xzf "${{ env.DIST_DIR }}/kernel_modules.tar.gz" -C wireless_module/system/lib/modules
          else
            find kernel_workspace/out -name "*.ko" -exec cp {} wireless_module/system/lib/modules/ \; || true
          fi

          cat << 'EOF' > wireless_module/module.prop
          id=Wireless-firmware
          name=Wireless NetHunter Drivers & Firmware
          version=v3
          versionCode=3
          author=mizdrake7
          description=NetHunter Wireless Drivers packaged like mizdrake7 style
          EOF

          cat << 'EOF' > wireless_module/service.sh
          #!/bin/sh
          sleep 25
          LOG=/data/local/tmp/nethunter_wireless.log
          MODDIR=/data/adb/modules/Wireless-firmware/system/lib/modules

          echo "===== $(date) =====" >> $LOG

          echo /system/etc/firmware > /sys/module/firmware_class/parameters/path 2>>$LOG

          load(){
           MOD="$1"
           if [ -f "$MODDIR/$MOD.ko" ]; then
             echo "Loading $MOD" >> $LOG
             insmod "$MODDIR/$MOD.ko" >>$LOG 2>&1
           else
             echo "$MOD missing" >> $LOG
           fi
          }

          load cfg80211
          load mac80211

          load ath

          load ath9k_hw
          load ath9k_common
          load ath9k_htc

          load rt2x00lib
          load rt2x00usb
          load rt2800lib
          load rt2800usb

          load rtl8187

          rmmod mt7601u 2>/dev/null
          load mt7601u

          dmesg | grep -i -E "mt7601|firmware|cfg80211|mac80211|ath|ath9k|rt2x00|rt2800|rtl8187" >> $LOG 2>&1

          echo "Wireless modules finished" >> $LOG
          EOF
          chmod +x wireless_module/service.sh

          cat << 'EOF' > wireless_module/META-INF/com/google/android/update-binary
          #!/sbin/sh
          OUTFD=$2
          ZIPFILE=$3
          mount /data 2>/dev/null
          unzip -o "$ZIPFILE" 'system/*' -d /data/adb/modules/Wireless-firmware/ 2>/dev/null
          cp -rf service.sh /data/adb/modules/Wireless-firmware/
          cp -rf module.prop /data/adb/modules/Wireless-firmware/
          touch /data/adb/modules/Wireless-firmware/update
          exit 0
          EOF
          chmod +x wireless_module/META-INF/com/google/android/update-binary

          cd wireless_module
          zip -r9 -q "../Wireless_Nethunter_Firmware_v3.zip" .

      - name: Repack vendor_boot with NetHunter modules (mizdrake7 style, MTK only)
        run: |
          set -euo pipefail
          # This mirrors mizdrake7/Scripts:make-nh-vendorboot_air.sh, which
          # injects wireless .ko's directly into vendor_boot's ramdisk
          # (Android boot header v3/v4, MTK unpack_bootimg.py/mkbootimg.py)
          # instead of loading them via a Magisk module at boot.
          #
          # IMPORTANT: that script is written for mizdrake7's own MTK
          # "air" device tree (Redmi 13C 5G / POCO M6 5G) and expects a
          # device-provided vendor_boot.img plus mkbootimg tools from that
          # tree. This job builds a generic GKI (android12-5.10) kernel,
          # which has no vendor_boot of its own and no device ramdisk to
          # patch — so this step only activates if you drop a real
          # vendor_boot.img into the workspace (e.g. pulled from your
          # target device's stock firmware) before this job runs. If it's
          # not present, this step no-ops instead of failing the build.
          VENDOR_BOOT="kernel_workspace/vendor_boot.img"
          if [ ! -f "$VENDOR_BOOT" ]; then
            echo "No vendor_boot.img supplied — skipping vendor_boot repack (GKI target has none)."
            exit 0
          fi

          sudo apt-get install -y lz4 cpio
          mkdir -p tools
          curl -fsSL -o tools/unpack_bootimg.py \
            https://raw.githubusercontent.com/mizdrake7/Scripts/main/unpack_bootimg.py 2>/dev/null || \
            echo "unpack_bootimg.py not found upstream at that path — supply your own tools/unpack_bootimg.py from your device's AOSP tree."
          curl -fsSL -o tools/mkbootimg.py \
            https://raw.githubusercontent.com/mizdrake7/Scripts/main/mkbootimg.py 2>/dev/null || \
            echo "mkbootimg.py not found upstream at that path — supply your own tools/mkbootimg.py from your device's AOSP tree."

          if [ ! -s tools/unpack_bootimg.py ] || [ ! -s tools/mkbootimg.py ]; then
            echo "Required mkbootimg tools missing — skipping vendor_boot repack."
            exit 0
          fi

          WORK="$(mktemp -d)"
          cp "$VENDOR_BOOT" "$WORK/vendor_boot.img"
          cp Wireless_Nethunter_Firmware_v3.zip "$WORK/nethunter_modules.zip"
          cd "$WORK"

          python3 "$OLDPWD/tools/unpack_bootimg.py" --boot_img vendor_boot.img --out out > info.txt
          ORIG_SIZE=$(stat -c "%s" vendor_boot.img)
          HEADER=$(grep "vendor boot image header version" info.txt | awk '{print $NF}')
          PAGESIZE=$(grep "page size" info.txt | awk '{print $NF}')
          BASE=$(grep "kernel load address" info.txt | awk '{print $NF}')
          RAMDISK_ADDR=$(grep "ramdisk load address" info.txt | awk '{print $NF}')
          TAGS=$(grep "kernel tags load address" info.txt | awk '{print $NF}')
          DTB_ADDR=$(grep "dtb address" info.txt | awk '{print $NF}')
          CMDLINE=$(grep "vendor command line args" info.txt | cut -d: -f2- | sed 's/^ //')

          mkdir ramdisk nh
          cd ramdisk
          lz4 -d ../out/vendor_ramdisk00 -c | cpio -idmv >/dev/null
          cd ../nh
          unzip -oq ../nethunter_modules.zip
          cp -fv *.ko ../ramdisk/lib/modules/ 2>/dev/null || echo "no top-level .ko in module zip (check its layout)"
          cd ../ramdisk
          find . | cpio -o -H newc 2>/dev/null | lz4 -l > ../vendor_ramdisk_new
          cd ..

          python3 "$OLDPWD/tools/mkbootimg.py" \
            --vendor_boot vendor_boot_new.img \
            --header_version "$HEADER" \
            --pagesize $((PAGESIZE)) \
            --base "$BASE" \
            --kernel_offset 0x0 \
            --ramdisk_offset $((RAMDISK_ADDR-BASE)) \
            --tags_offset $((TAGS-BASE)) \
            --dtb_offset $((DTB_ADDR-BASE)) \
            --vendor_ramdisk vendor_ramdisk_new \
            --dtb out/dtb \
            --vendor_cmdline "$CMDLINE"

          cp vendor_boot_new.img "$OLDPWD/nh-vendor_boot.img"
          truncate -s "$ORIG_SIZE" "$OLDPWD/nh-vendor_boot.img"
          cd "$OLDPWD"
          python3 tools/unpack_bootimg.py --boot_img nh-vendor_boot.img --out /tmp/verify_out
          echo "Generated nh-vendor_boot.img"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.device_name }}-build
          path: |
            *.zip
            nh-vendor_boot.img
          retention-days: 14
          if-no-files-found: warn
